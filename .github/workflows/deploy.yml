name: Publicar MailDesk

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Crear versión pública
        run: npm run build
        env:
          VITE_SUPABASE_URL=https://fdflrfoxninkywwsfyis.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_atczbHU1p-DeW3Ugf9Y62w_C0IOlch9

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio generado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4